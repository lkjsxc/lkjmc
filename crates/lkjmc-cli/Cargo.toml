[package]
name = "lkjmc-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lkjmc"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
lkjmc-core = { path = "../lkjmc-core" }
lkjmc-store = { path = "../lkjmc-store" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
sha2 = "0.10"
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[lints]
workspace = true
