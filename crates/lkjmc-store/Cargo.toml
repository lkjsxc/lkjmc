[package]
name = "lkjmc-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
lkjmc-core = { path = "../lkjmc-core" }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "v5"] }

[lints]
workspace = true
