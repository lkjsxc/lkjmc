[package]
name = "lkjmc-daemon"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lkjmc-daemon"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
lkjmc-core = { path = "../lkjmc-core" }
lkjmc-store = { path = "../lkjmc-store" }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1"] }
serde_json = "1.0"
md-5 = "0.10"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }

[lints]
workspace = true
