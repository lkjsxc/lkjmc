[package]
name = "lkjmc-discord"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lkjmc-discord"
path = "src/main.rs"

[dependencies]
axum = "0.8"
lkjmc-core = { path = "../lkjmc-core" }
ring = "0.17"
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
ureq = { version = "2", features = ["json"] }

[lints]
workspace = true
