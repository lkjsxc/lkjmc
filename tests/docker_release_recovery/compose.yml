services:
  host:
    image: ${LKJMC_DRR_IMAGE:?set LKJMC_DRR_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        io.lkjmc.docker-release-recovery.project: ${LKJMC_DRR_PROJECT:?set LKJMC_DRR_PROJECT}
        io.lkjmc.docker-release-recovery.purpose: systemd-host-image
    container_name: ${LKJMC_DRR_CONTAINER:?set LKJMC_DRR_CONTAINER}
    hostname: lkjmc-lab-host
    tty: true
    labels:
      io.lkjmc.docker-release-recovery.project: ${LKJMC_DRR_PROJECT}
      io.lkjmc.docker-release-recovery.purpose: systemd-host
    environment:
      LKJMC_DRR_PROJECT: ${LKJMC_DRR_PROJECT}
      SYSTEMD_LOG_LEVEL: info
      SYSTEMD_LOG_TARGET: console
    command: ["/usr/local/libexec/lkjmc-drr-systemd-entrypoint"]
    cgroup: private
    cap_drop: ["ALL"]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - NET_BIND_SERVICE
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_ADMIN
      - SYS_CHROOT
    security_opt:
      - apparmor=unconfined
      - no-new-privileges:false
    tmpfs:
      - /sys/fs/cgroup:rw,nosuid,nodev,noexec,mode=755
      - /run:rw,nosuid,nodev,mode=755
      - /run/lock:rw,nosuid,nodev,noexec,mode=755
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    stop_signal: SIGRTMIN+3
    stop_grace_period: 45s
    mem_limit: ${LKJMC_DRR_MEMORY_LIMIT:-768m}
    cpus: ${LKJMC_DRR_CPU_LIMIT:-2.0}
    pids_limit: ${LKJMC_DRR_PIDS_LIMIT:-512}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - lab

networks:
  lab:
    internal: true
    labels:
      io.lkjmc.docker-release-recovery.project: ${LKJMC_DRR_PROJECT}
      io.lkjmc.docker-release-recovery.purpose: private-lab-network
