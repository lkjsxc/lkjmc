services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lkjmc
      POSTGRES_USER: lkjmc
      POSTGRES_PASSWORD: lkjmc-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lkjmc -d lkjmc"]
      interval: 2s
      timeout: 2s
      retries: 30

  verify:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LKJMC_STORE_TEST_DATABASE_URL: postgres://lkjmc:lkjmc-dev@postgres:5432/lkjmc
    command: ["./scripts/verify.sh"]
