[workspace]
members = [
    "crates/lkjmc-core",
    "crates/lkjmc-store",
    "crates/lkjmc-daemon",
    "crates/lkjmc-cli",
    "crates/lkjmc-discord",
    "crates/lkjmc-xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/lkjsxc/lkjmc"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
