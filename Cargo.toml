[workspace]
members = [
    "crates/lkjmc-core",
    "crates/lkjmc-store",
    "crates/lkjmc-daemon",
    "crates/lkjmc-cli",
    "crates/lkjmc-ops",
    "crates/lkjmc-discord",
    "crates/lkjmc-xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lkjsxc/lkjmc"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
