services:
  playable:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LKJMC_DATABASE_URL: postgres://lkjmc:lkjmc-dev@postgres:5432/lkjmc
      LKJMC_ACCEPT_MINECRAFT_EULA: ${LKJMC_ACCEPT_MINECRAFT_EULA:-0}
      LKJMC_PLAYABLE_BEDROCK: ${LKJMC_PLAYABLE_BEDROCK:-auto}
      LKJMC_PLAYABLE_ONLINE_MODE: ${LKJMC_PLAYABLE_ONLINE_MODE:-false}
      LKJMC_SMOKE_ADMIN_PLAYERS: ${LKJMC_SMOKE_ADMIN_PLAYERS:-LkjmcSmoke}
      LKJMC_PLAYABLE_JAVA_BIND_HOST: ${LKJMC_PLAYABLE_JAVA_BIND_HOST:-0.0.0.0}
      LKJMC_PLAYABLE_JAVA_PORT: ${LKJMC_PLAYABLE_JAVA_PORT:-25565}
      LKJMC_PLAYABLE_PUBLIC_HOST: ${LKJMC_PLAYABLE_PUBLIC_HOST:-}
      LKJMC_PLAYABLE_BEDROCK_PORT: ${LKJMC_PLAYABLE_BEDROCK_PORT:-19132}
      LKJMC_COMPOSE_EXIT_AFTER_BOOTSTRAP: ${LKJMC_COMPOSE_EXIT_AFTER_BOOTSTRAP:-0}
    ports:
      - "${LKJMC_PLAYABLE_JAVA_PORT:-25565}:${LKJMC_PLAYABLE_JAVA_PORT:-25565}/tcp"
      - "${LKJMC_PLAYABLE_BEDROCK_PORT:-19132}:${LKJMC_PLAYABLE_BEDROCK_PORT:-19132}/udp"
    volumes:
      - lkjmc-config:/etc/lkjmc
      - lkjmc-data:/var/lib/lkjmc
      - lkjmc-logs:/var/log/lkjmc
      - lkjmc-assets:/opt/lkjmc/assets
      - lkjmc-jars:/opt/lkjmc/jars
    command: ["./scripts/compose-playable-entrypoint.sh"]

volumes:
  lkjmc-config:
  lkjmc-data:
  lkjmc-logs:
  lkjmc-assets:
  lkjmc-jars:
