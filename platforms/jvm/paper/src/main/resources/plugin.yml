name: lkjmc
version: '0.0.0'
main: com.lkjmc.paper.LkjmcPaperPlugin
api-version: '1.21'
folia-supported: true
commands:
  menu:
    usage: /menu
    permission: lkjmc.user.menu
  docs:
    usage: /docs [search <query>|path]
    permission: lkjmc.user.docs
permissions:
  lkjmc.user.menu:
    default: true
  lkjmc.user.docs:
    default: true
