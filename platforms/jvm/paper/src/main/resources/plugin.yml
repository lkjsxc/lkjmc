name: lkjmc-paper
version: '0.0.0'
main: com.lkjmc.paper.LkjmcPaperPlugin
api-version: '1.21'
folia-supported: true
commands:
  lkjmc:
    description: lkjmc admin command
    usage: /lkjmc status|server
    permission: lkjmc.admin.status
  menu:
    description: Open the lkjmc menu
    usage: /menu
    permission: lkjmc.user.menu
  lang:
    description: Set lkjmc language
    usage: /lang <en|ja>
    permission: lkjmc.user.language
  points:
    description: Show points balance
    usage: /points
    permission: lkjmc.user.points
  sethome:
    description: Save current location as a home
    usage: /sethome <name>
    permission: lkjmc.user.home
  home:
    description: Teleport to a saved home
    usage: /home <name>
    permission: lkjmc.user.home
  setwarp:
    description: Save current location as a warp
    usage: /setwarp <name>
    permission: lkjmc.admin.warp
  warp:
    description: Teleport to a warp
    usage: /warp <name>
    permission: lkjmc.user.warp
  tpa:
    description: Request a same-server teleport
    usage: /tpa <player>
    permission: lkjmc.user.teleport.request
  tpaccept:
    description: Accept a same-server teleport request
    usage: /tpaccept [player]
    permission: lkjmc.user.teleport.request
  party:
    description: Manage a party
    usage: /party create|invite|accept|info|leave
    permission: lkjmc.user.party
  achievements:
    description: List claimed achievements
    usage: /achievements
    permission: lkjmc.user.achievements
  hud:
    description: Toggle lkjmc HUD preview
    usage: /hud <on|off>
    permission: lkjmc.user.hud
  shop:
    description: List shop items
    usage: /shop
    permission: lkjmc.user.shop
  buy:
    description: Buy a shop item
    usage: /buy <item>
    permission: lkjmc.user.shop
  kit:
    description: List and claim point kits
    usage: /kit [list|claim <kit>]
    permission: lkjmc.user.kit
  vote:
    description: Show server voting links
    usage: /vote
    permission: lkjmc.user.vote
  mail:
    description: Manage player mail
    usage: /mail inbox|read <id>|send <player> <message>
    permission: lkjmc.user.mail
  report:
    description: Report a player
    usage: /report <player> <reason>
    permission: lkjmc.user.report
  reports:
    description: Review player reports
    usage: /reports [resolve|dismiss <id>]
    permission: lkjmc.admin.reports
  warn:
    description: Warn an online player
    usage: /warn <player> <reason>
    permission: lkjmc.admin.warn
  warnings:
    description: List player warnings
    usage: /warnings <player>
    permission: lkjmc.admin.warn
  note:
    description: Add a moderation note
    usage: /note <player> <note>
    permission: lkjmc.admin.warn
  notes:
    description: List moderation notes
    usage: /notes <player>
    permission: lkjmc.admin.warn
  ban:
    description: Ban an online player
    usage: /ban <player> <reason>
    permission: lkjmc.admin.ban
  unban:
    description: Revoke player bans
    usage: /unban <player>
    permission: lkjmc.admin.ban
  mute:
    description: Mute an online player
    usage: /mute <player> <reason>
    permission: lkjmc.admin.mute
  unmute:
    description: Revoke player mutes
    usage: /unmute <player>
    permission: lkjmc.admin.mute
  daily:
    description: Claim daily points
    usage: /daily
    permission: lkjmc.user.daily
  endexpedition:
    description: Purchase and start an End Expedition
    usage: /endexpedition [party|return]
    permission: lkjmc.user.adventure
  announce:
    description: Broadcast a durable announcement
    usage: /announce <message>
    permission: lkjmc.admin.announce
  claim:
    description: Manage chunk claims
    usage: /claim create|list|delete|trust|untrust|here
    permission: lkjmc.user.claim
permissions:
  lkjmc.admin.status:
    default: op
  lkjmc.admin.instance.list:
    default: op
  lkjmc.admin.instance.create:
    default: op
  lkjmc.admin.instance.start:
    default: op
  lkjmc.admin.instance.stop:
    default: op
  lkjmc.admin.instance.restart:
    default: op
  lkjmc.admin.instance.delete:
    default: op
  lkjmc.user.menu:
    default: true
  lkjmc.user.language:
    default: true
  lkjmc.user.points:
    default: true
  lkjmc.user.home:
    default: true
  lkjmc.user.warp:
    default: true
  lkjmc.admin.warp:
    default: op
  lkjmc.user.teleport.request:
    default: true
  lkjmc.user.party:
    default: true
  lkjmc.user.achievements:
    default: true
  lkjmc.user.hud:
    default: true
  lkjmc.user.shop:
    default: true
  lkjmc.user.kit:
    default: true
  lkjmc.user.vote:
    default: true
  lkjmc.user.mail:
    default: true
  lkjmc.user.report:
    default: true
  lkjmc.user.claim:
    default: true
  lkjmc.admin.claim:
    default: op
  lkjmc.admin.reports:
    default: op
  lkjmc.admin.warn:
    default: op
  lkjmc.admin.ban:
    default: op
  lkjmc.admin.mute:
    default: op
  lkjmc.admin.announce:
    default: op
  lkjmc.user.daily:
    default: true
  lkjmc.user.adventure:
    default: true
