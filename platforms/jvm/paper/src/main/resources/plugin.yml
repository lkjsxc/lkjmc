name: lkjmc
version: '0.0.0'
main: com.lkjmc.paper.LkjmcPaperPlugin
api-version: '1.21'
folia-supported: true
commands:
  lkjmc:
    usage: /lkjmc status|doctor|server
  menu:
    usage: /menu
    permission: lkjmc.user.menu
  lang:
    usage: /lang <en|ja>
    permission: lkjmc.user.language
  points:
    usage: /points
    permission: lkjmc.user.points
  sethome:
    usage: /sethome <name>
    permission: lkjmc.user.home
  home:
    usage: /home <name>
    permission: lkjmc.user.home
  setwarp:
    usage: /setwarp <name>
    permission: lkjmc.admin.warp
  warp:
    usage: /warp <name>
    permission: lkjmc.user.warp
  tpa:
    usage: /tpa <player>
    permission: lkjmc.user.teleport.request
  tpaccept:
    usage: /tpaccept [player]
    permission: lkjmc.user.teleport.request
  party:
    usage: /party create|invite|accept|info|leave
    permission: lkjmc.user.party
  achievements:
    usage: /achievements
    permission: lkjmc.user.achievements
  hud:
    usage: /hud <on|off>
    permission: lkjmc.user.hud
  shop:
    usage: /shop
    permission: lkjmc.user.shop
  buy:
    usage: /buy <item>
    permission: lkjmc.user.shop
  exchange:
    usage: /exchange <material> <amount|all>
    permission: lkjmc.user.exchange
  docs:
    usage: /docs [search <query>|path]
    permission: lkjmc.user.docs
  kit:
    usage: /kit [list|claim <kit>]
    permission: lkjmc.user.kit
  vote:
    usage: /vote
    permission: lkjmc.user.vote
  mail:
    usage: /mail inbox|read <id>|send <player> <message>
    permission: lkjmc.user.mail
  report:
    usage: /report <player> <reason>
    permission: lkjmc.user.report
  reports:
    usage: /reports [resolve|dismiss <id>]
    permission: lkjmc.admin.reports
  warn:
    usage: /warn <player> <reason>
    permission: lkjmc.admin.warn
  warnings:
    usage: /warnings <player>
    permission: lkjmc.admin.warn
  note:
    usage: /note <player> <note>
    permission: lkjmc.admin.warn
  notes:
    usage: /notes <player>
    permission: lkjmc.admin.warn
  ban:
    usage: /ban <player> <reason>
    permission: lkjmc.admin.ban
  unban:
    usage: /unban <player>
    permission: lkjmc.admin.ban
  mute:
    usage: /mute <player> <reason>
    permission: lkjmc.admin.mute
  unmute:
    usage: /unmute <player>
    permission: lkjmc.admin.mute
  daily:
    usage: /daily
    permission: lkjmc.user.daily
  endexpedition:
    usage: /endexpedition [party|return]
    permission: lkjmc.user.adventure
  announce:
    usage: /announce <message>
    permission: lkjmc.admin.announce
  claim:
    usage: /claim create|list|delete|trust|untrust|here
    permission: lkjmc.user.claim
permissions:
  lkjmc.admin.status:
    default: op
  lkjmc.admin.reload:
    default: op
  lkjmc.admin.admin:
    default: op
  lkjmc.admin.economy:
    default: op
  lkjmc.admin.send:
    default: op
  lkjmc.admin.instance.list:
    default: op
  lkjmc.admin.instance.create:
    default: op
  lkjmc.admin.instance.start:
    default: op
  lkjmc.admin.instance.stop:
    default: op
  lkjmc.admin.instance.restart:
    default: op
  lkjmc.admin.instance.delete:
    default: op
  lkjmc.user.menu:
    default: true
  lkjmc.user.language:
    default: true
  lkjmc.user.points:
    default: true
  lkjmc.user.home:
    default: true
  lkjmc.user.warp:
    default: true
  lkjmc.admin.warp:
    default: op
  lkjmc.user.teleport.request:
    default: true
  lkjmc.user.party:
    default: true
  lkjmc.user.achievements:
    default: true
  lkjmc.user.hud:
    default: true
  lkjmc.user.shop:
    default: true
  lkjmc.user.exchange:
    default: true
  lkjmc.user.docs:
    default: true
  lkjmc.user.kit:
    default: true
  lkjmc.user.vote:
    default: true
  lkjmc.user.mail:
    default: true
  lkjmc.user.report:
    default: true
  lkjmc.user.claim:
    default: true
  lkjmc.admin.claim:
    default: op
  lkjmc.admin.reports:
    default: op
  lkjmc.admin.warn:
    default: op
  lkjmc.admin.ban:
    default: op
  lkjmc.admin.mute:
    default: op
  lkjmc.admin.announce:
    default: op
  lkjmc.user.daily:
    default: true
  lkjmc.user.adventure:
    default: true
