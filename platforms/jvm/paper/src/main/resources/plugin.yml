name: lkjmc-paper
version: '0.0.0'
main: com.lkjmc.paper.LkjmcPaperPlugin
api-version: '1.21'
folia-supported: true
commands:
  lkjmc:
    description: lkjmc status command
    usage: /lkjmc status
    permission: lkjmc.admin.status
  menu:
    description: Open the lkjmc menu
    usage: /menu
    permission: lkjmc.user.menu
  lang:
    description: Set lkjmc language
    usage: /lang <en|ja>
    permission: lkjmc.user.language
  points:
    description: Show points balance
    usage: /points
    permission: lkjmc.user.points
  sethome:
    description: Save current location as a home
    usage: /sethome <name>
    permission: lkjmc.user.home
  home:
    description: Teleport to a saved home
    usage: /home <name>
    permission: lkjmc.user.home
  setwarp:
    description: Save current location as a warp
    usage: /setwarp <name>
    permission: lkjmc.admin.warp
  warp:
    description: Teleport to a warp
    usage: /warp <name>
    permission: lkjmc.user.warp
permissions:
  lkjmc.admin.status:
    default: op
  lkjmc.user.menu:
    default: true
  lkjmc.user.language:
    default: true
  lkjmc.user.points:
    default: true
  lkjmc.user.home:
    default: true
  lkjmc.user.warp:
    default: true
  lkjmc.admin.warp:
    default: op
