name: Lkjmc
version: 0.1.0
main: com.lkjsxc.lkjmc.paper.LkjmcPaper
api-version: '26.2'
load: STARTUP
depend: [WorldEdit, WorldGuard]
description: Official lkjmc world adapter
commands:
  lkjmc:
    description: Open the lkjmc player menu
    aliases: [lkj, menu]
  home:
    description: Travel home or save your current place
  claim:
    description: Protect builds and manage land
  tpa:
    description: Ask another player to meet up
  tpahere:
    description: Ask a player to come to your location
  tpaccept:
    description: Accept a pending teleport request
  tpdeny:
    description: Decline a pending teleport request
  expedition:
    description: Explore a temporary world or return to SMP
