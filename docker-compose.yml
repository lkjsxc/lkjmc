services:
  postgres:
    image: postgres:14-alpine@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    environment:
      POSTGRES_DB: lkjmc
      POSTGRES_USER: lkjmc
      POSTGRES_PASSWORD: lkjmc-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lkjmc -d lkjmc"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 60s

  verify:
    build:
      context: .
      target: verify
    profiles: ["verify"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LKJMC_STORE_TEST_DATABASE_URL: postgres://lkjmc:lkjmc-dev@postgres:5432/lkjmc
      LKJMC_CLAIM_SMOKE: "1"
      LKJMC_WEB_SMOKE: "1"
      RUST_TEST_THREADS: "4"
    command: ["./scripts/verify-full.sh"]
