services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lkjmc
      POSTGRES_USER: lkjmc
      POSTGRES_PASSWORD: lkjmc-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lkjmc -d lkjmc"]
      interval: 5s
      timeout: 3s
      retries: 20

  builder:
    build: .
    command: ["./scripts/verify.sh"]

  integration:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./scripts/verify.sh"]

  smoke:
    build: .
    command: ["./scripts/verify.sh"]
